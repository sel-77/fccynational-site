name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Read-only token: CI only needs to read the code.
permissions:
  contents: read

# A new push to the same PR cancels the older, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      # npm ci installs exactly what package-lock.json says (unlike npm install).
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
